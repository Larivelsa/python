{% extends "template.html"%}
{% block conteudo %}
<table class="table table-striped table-responsive table-bordered">
    <thead>
        <tr>
            <th>ID</th>
            <th>Descrição</th>
            <th>Ação</th>
        </tr>
    </thead>
    <tbody>
        {% for tarefa in tarefas %}
        <tr>
            <td>{{ tarefa.id }}</td>
            <td>{{ tarefa.descricao }}</td>
            <td><a href="{{ url_for('concluir', id=tarefa.id) }}">Concluir</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="{{ url_for('nova') }}">Nova Tarefa</a>
{% endblock %}
