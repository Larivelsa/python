{% extends "base.html" %}
{% block conteudo %}
<h1> {{ titulo }}</h1>

<form action="{{ url_for('adicionar_categoria') }}" method="POST">
    <div class="input-field">
        <input type="text" name="nome_categoria" id="nome_categoria">
        <label for="nome_categoria">Nome</label>
    </div>

    <button class="btn waves-effect waves-light" type="submit">Adicionar categoria</button>
    <a class="btn waves-effect waves-light" href="{{ url_for('inicio') }}">Início</a>
</form>


{% endblock %}
