{% extends "base.html" %}
{% block conteudo %}
<h1> {{ titulo }}</h1>

<form action="{{ url_for('adicionar_categoria') }}" method="POST">


    <fieldset>
          {{ form.csrf_token() }}
          <div class="input-field">
            {{ form.nome.label }}
            {{ form.nome(class="validate") }}
          </div>

          <div>
            {{ form.salvar(class="btn waves-effect waves-light") }}

    <a class="btn waves-effect waves-light" href="{{ url_for('inicio') }}">Início</a>
</form>


{% endblock %}
